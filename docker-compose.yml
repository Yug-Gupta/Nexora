# Nexora development stack: Neo4j + the Streamlit application.
#
#   docker compose up --build
#
# Model inference runs through the Google Gemini API, so no model container is
# needed. Provide your API key via a root .env file (see .env.example):
#
#   GEMINI_API_KEY=...        # required, never commit this
#   GEMINI_MODEL=gemini-2.5-flash
#
# To point the app at an external Neo4j (e.g. AuraDB) instead of the bundled
# container, set NEO4J_URI / NEO4J_USER / NEO4J_PASSWORD in .env.
#
# IMPORTANT: with the bundled container, the app must talk to the service name
# `graphdb`, not localhost. If your local `.env` sets NEO4J_URI to
# bolt://127.0.0.1:7687 (for `streamlit run`), override it for Compose:
#   NEO4J_URI=bolt://graphdb:7687 docker compose up --build
# or remove that line from `.env` while using Compose.
#
# Then open http://localhost:8501

services:
  graphdb:
    image: neo4j:latest
    container_name: nexora-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-studio
    ports:
      - "8501:8501"
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://graphdb:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      graphdb:
        condition: service_healthy

volumes:
  neo4j_data:
